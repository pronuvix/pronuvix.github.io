name: Site validation
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_site.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check_homepage.cjs
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: rsvg-convert zelunvo/assets/social-preview.svg -o homepage-previews/social-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-previews
          path: homepage-previews/
