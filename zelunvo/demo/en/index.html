<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore a family budget | Zelunvo</title><link rel="stylesheet" href="/zelunvo/assets/site.css"><link rel="icon" href="/zelunvo/assets/favicon.svg"><style>label{display:block;margin:1rem 0}input{width:100%;max-width:22rem;display:block}output{font-weight:bold;font-variant-numeric:tabular-nums}.metric{font-size:2rem}meter{width:100%;height:1.5rem}</style></head><body><nav><a class="brandmark" href="/zelunvo/"><img src="/zelunvo/assets/favicon.svg" alt="">Zelunvo</a><div><a href="/zelunvo/demo/en/">EN</a> <a href="/zelunvo/demo/pt/">PT</a> <a href="/zelunvo/demo/fr/">FR</a> <a href="/zelunvo/demo/es/">ES</a> </div></nav><header><div><h1>Explore a family budget</h1><p>Illustrative demo — not a screenshot of the application</p></div></header><main><div class="grid"><article><h2>Monthly income</h2><label>Monthly income <output id="v0">3200 €</output><input id="n0" type="range" min="0" max="8000" step="50" value="3200"></label><label>Housing <output id="v1">900 €</output><input id="n1" type="range" min="0" max="3000" step="50" value="900"></label><label>Food <output id="v2">550 €</output><input id="n2" type="range" min="0" max="3000" step="50" value="550"></label><label>Transport <output id="v3">300 €</output><input id="n3" type="range" min="0" max="3000" step="50" value="300"></label><label>Other expenses <output id="v4">450 €</output><input id="n4" type="range" min="0" max="3000" step="50" value="450"></label></article><article aria-live="polite"><h2>Monthly expenses</h2><output class="metric" id="expense">2200 €</output><h2>Monthly surplus</h2><output class="metric" id="balance">1000 €</output><h2>Savings rate</h2><output id="rate">31.25%</output><meter id="meter" min="0" max="100" value="31.25"></meter></article></div><section class="panel" style="margin-top:1rem"><h2>Savings goal</h2><label>Target (€)<input id="saving0" type="number" min="0" max="100000000" step="50" value="10000"></label><label>Already saved (€)<input id="saving1" type="number" min="0" max="100000000" step="50" value="2000"></label><label>Monthly contribution (€)<input id="saving2" type="number" min="0" max="100000000" step="50" value="300"></label><p>Months remaining: <output id="months" aria-live="polite">27</output></p><progress id="saving-progress" max="100" value="20"></progress></section></main><script>const f=new Intl.NumberFormat(document.documentElement.lang,{style:'currency',currency:'EUR'});const inputs=Array.from({length:5},(_,i)=>document.getElementById('n'+i));function update(){const a=inputs.map(x=>Number(x.value));a.forEach((v,i)=>document.getElementById('v'+i).textContent=f.format(v));const e=a.slice(1).reduce((x,y)=>x+y,0),b=a[0]-e,r=a[0]?100*b/a[0]:null;document.getElementById('expense').textContent=f.format(e);document.getElementById('balance').textContent=f.format(b);document.getElementById('rate').textContent=r===null?'—':new Intl.NumberFormat(document.documentElement.lang,{maximumFractionDigits:1}).format(r)+'%';document.getElementById('meter').value=Math.max(0,Math.min(100,r||0))}inputs.forEach(x=>x.addEventListener('input',update));update()</script><script>const savings=Array.from({length:3},(_,i)=>document.getElementById('saving'+i));function savingsUpdate(){const [goal,current,monthly]=savings.map(x=>Math.max(0,Number(x.value)||0));const remaining=Math.max(0,goal-current);document.getElementById('months').textContent=remaining===0?'0':monthly>0?Math.ceil(remaining/monthly):'—';document.getElementById('saving-progress').value=goal?Math.min(100,current/goal*100):100}savings.forEach(x=>x.addEventListener('input',savingsUpdate));savingsUpdate()</script></body></html>
